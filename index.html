<!doctype html>
<html lang="en">
<head>
<title>Brainwave</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=DM+Mono:wght@500&display=swap">
<style>
/* Layout: one centered game column — scoreboard strip, spectrum card, the dial as the hero, then the phase's controls. */
:root {
  --bg: #e9ecf7;
  --panel: #ffffff;
  --ink: #1c2140;
  --muted: #5d6385;
  --line: #cfd4ea;
  --dial: #f6f7fd;
  --screen: #3a3f5c;
  --static-dot: #c9cde0;
  --band2: #b6e3d4;
  --band3: #3fb59e;
  --band4: #6c3fd6;
  --band-label: #1c2140;
  --needle: #1c2140;
  --accent: #2c3a8c;
  --accent-ink: #ffffff;
  --left: #3f8fd9;
  --right: #e2558a;
  --good: #1f8a5b;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152b; --panel: #1b2040; --ink: #eef0fb; --muted: #a2a8cc; --line: #2f365f;
    --dial: #232a52; --screen: #0b0d1c; --static-dot: #5a6090; --band2: #3b7f6f; --band3: #2a8f7d;
    --band4: #8a63f0; --band-label: #eef0fb; --needle: #eef0fb; --accent: #8e9cff; --accent-ink: #12152b;
    --left: #6aaeea; --right: #ef7aa6; --good: #4cc48a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152b; --panel: #1b2040; --ink: #eef0fb; --muted: #a2a8cc; --line: #2f365f;
  --dial: #232a52; --screen: #0b0d1c; --static-dot: #5a6090; --band2: #3b7f6f; --band3: #2a8f7d;
  --band4: #8a63f0; --band-label: #eef0fb; --needle: #eef0fb; --accent: #8e9cff; --accent-ink: #12152b;
  --left: #6aaeea; --right: #ef7aa6; --good: #4cc48a; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--font-body);
  padding-inline: 16px; padding-block: 20px 40px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.stack { display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 {
  font-family: var(--font-display); font-weight: 800; font-size: clamp(1.8rem, 6vw, 2.4rem);
  letter-spacing: -0.03em; margin: 0; line-height: 1;
}
h1 .wave { color: var(--band4); }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; margin: 0; text-wrap: balance; }
.eyebrow { font-family: var(--font-mono); font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }

button {
  font: 700 1rem/1 var(--font-body); border-radius: 999px; border: 2px solid var(--accent);
  padding: 12px 20px; cursor: pointer; background: var(--accent); color: var(--accent-ink);
  transition: transform .08s ease, opacity .15s;
}
button:hover { transform: translateY(-1px); }
button:active { transform: translateY(1px); }
button.ghost { background: transparent; color: var(--accent); }
button.link { background: none; border: none; color: var(--muted); padding: 6px 4px; text-decoration: underline; font-weight: 400; font-size: .9rem; }
button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
button:focus-visible, input:focus-visible, textarea:focus-visible, svg:focus-visible { outline: 3px solid var(--band3); outline-offset: 2px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.end { justify-content: flex-end; }
.row > .grow { flex: 1 1 200px; }

label { font-weight: 700; font-size: .9rem; display: flex; flex-direction: column; gap: 6px; }
input[type=text], input[type=number], textarea {
  font: 1rem var(--font-body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%;
}
textarea { min-height: 96px; resize: vertical; font-family: var(--font-mono); font-size: .85rem; }
.hint { color: var(--muted); font-size: .85rem; margin: 0; }

/* Scoreboard */
.scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.team { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; }
.team.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent) inset; }
.team .name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.team .pts { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; font-variant-numeric: tabular-nums; line-height: 1; }
.team .pts + .of, .team > span:last-child { white-space: nowrap; }
.team .of { font-family: var(--font-mono); font-size: .75rem; color: var(--muted); }

/* Spectrum card */
.card { display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch; border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
.card > div { padding: 12px 14px; font-family: var(--font-display); font-weight: 800; font-size: clamp(1rem, 4.2vw, 1.3rem); line-height: 1.15; display: flex; align-items: center; min-width: 0; overflow-wrap: break-word; hyphens: auto; }
.card .l { background: var(--left); color: #fff; }
.card .r { background: var(--right); color: #fff; justify-content: flex-end; text-align: right; }
.card .mid { background: var(--panel); padding: 0 8px; color: var(--muted); font-family: var(--font-mono); font-weight: 500; font-size: .8rem; }

/* Dial */
.dialbox { position: relative; }
svg.dial { width: 100%; max-width: 100%; height: auto; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
svg.dial.draggable { cursor: grab; }
.static { transform-box: view-box; transform-origin: 260px 112px; }
.static.open { animation: tv-off .75s cubic-bezier(.5,0,.3,1) forwards; }
@keyframes tv-off {
  0% { transform: scale(1, 1); opacity: 1; }
  55% { transform: scale(1, .015); opacity: 1; }
  100% { transform: scale(0, .015); opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { .static.open { animation: none; opacity: 0; } }
.clue { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; text-align: center; overflow-wrap: anywhere; }
.clue small { display: block; font-family: var(--font-mono); font-weight: 500; font-size: .72rem; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.result { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.result .big { font-family: var(--font-display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
.result .big.zero { color: var(--muted); }
.pill { display: inline-block; font-family: var(--font-mono); font-size: .75rem; padding: 3px 10px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); }
.lr { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.lr button { padding: 16px; font-size: 1.05rem; }
.lr .bl { background: var(--left); border-color: var(--left); color: #fff; }
.lr .br { background: var(--right); border-color: var(--right); color: #fff; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.winner { text-align: center; }
.winner .big { font-family: var(--font-display); font-weight: 800; font-size: clamp(2rem, 9vw, 3rem); line-height: 1.05; text-wrap: balance; }
details summary { cursor: pointer; font-weight: 700; }
ol.rules { margin: 8px 0 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 6px; color: var(--muted); max-width: 65ch; }
ol.rules b { color: var(--ink); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 520px) { .seg.four { grid-template-columns: 1fr 1fr; } }
.field-label { font-weight: 700; font-size: .9rem; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; }
.seg button { background: transparent; border: none; color: var(--ink); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; align-items: flex-start; text-align: left; line-height: 1.2; }
.seg button span { font-weight: 400; font-size: .82rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[aria-pressed="true"] span { color: var(--accent-ink); opacity: .85; }
.confirm { background: var(--bg); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Brain<span class="wave">wave</span></h1>
    <span class="eyebrow" id="deckInfo"></span>
  </header>
  <main id="app" class="stack"></main>
</div>

<script>
// ---------- Cards: [left, right], grouped by difficulty ----------
// Easy: concrete scales with obvious clues. Normal: matters of taste and opinion.
// Hard: abstract or value-laden scales that spark debate.
const CARD_SETS = {
  easy: [
  ["Cold","Hot"],["Cheap","Expensive"],["Tiny","Huge"],["Quiet","Loud"],["Slow","Fast"],
  ["Light","Heavy"],["Soft","Hard"],["Rough","Smooth"],["Dry food","Wet food"],["Mild","Spicy"],
  ["Sweet","Savory"],["Safe","Dangerous"],["Square","Round"],["Liquid","Solid"],["Dirty","Clean"],
  ["Rare","Common"],["Short-lived","Long-lived"],["Indoor activity","Outdoor activity"],["Rural","Urban"],
  ["Analog","Digital"],["Snack","Meal"],["Breakfast food","Dinner food"],["Casual","Formal"],
  ["Painless","Painful"],["Fragile","Indestructible"],["For kids","For adults"],["Unknown","Famous"],
  ["Easy instrument","Hard instrument"],["Easy to spell","Hard to spell"],["Temporary","Permanent"],
  ["Scary animal","Cuddly animal"],["Fantasy","Sci-fi"],["Better hot","Better cold"],
  ["Best eaten raw","Best eaten cooked"],["Old-fashioned","Futuristic"],["Hard to sit on","Comfy to sit on"],
  ["Tastes bad","Tastes good"],["Smells bad","Smells good"],["Unhealthy food","Healthy food"],
  ["Useless","Useful"],["Easy job","Hard job"],["Easy to draw","Hard to draw"],["Messy food","Clean food"],
  ["Weak","Strong"],["Thing you buy once","Thing you buy all the time"],["Villain","Hero"],
  ["Dull","Sharp"],["Dark","Bright"],["Chill","Intense"],["Simple","Complicated"],["Calm","Chaotic"],
  ["Cheap hobby","Expensive hobby"],["Quick to make","Takes all day to make"],["Cheap date","Fancy date"],
  ["Easy to carry","Impossible to carry"],["Lives on land","Lives in water"],["Shy","Bold"],
  ["Peaceful","Violent"],["Lazy","Hardworking"],["Mean","Nice"],["Poorly made","Well made"]
  ],
  normal: [
  ["Underrated","Overrated"],["Bad movie","Good movie"],["Bad TV show","Good TV show"],
  ["Boring hobby","Exciting hobby"],["Normal pet","Weird pet"],["Ugly word","Beautiful word"],
  ["Forgettable","Unforgettable"],["Sad song","Happy song"],["Bad habit","Good habit"],["Sport","Game"],
  ["Useless superpower","Amazing superpower"],["Bad pizza topping","Good pizza topping"],
  ["Underrated city","Overrated city"],["Needs no talent","Needs a lot of talent"],["Bad gift","Great gift"],
  ["Science","Art"],["Cat energy","Dog energy"],["Mainstream","Niche"],["Bad advice","Good advice"],
  ["Normal","Cursed"],["Uncool","Cool"],["Worst Olympic sport","Best Olympic sport"],
  ["Bad name for a pet","Good name for a pet"],["Unsexy","Sexy"],["Fad","Classic"],["Basic","Hipster"],
  ["Worst era to live in","Best era to live in"],["Normal sandwich","Weird sandwich"],
  ["Bad superhero","Good superhero"],["Bad board game","Good board game"],["Relaxing","Stressful"],
  ["Minor inconvenience","Major disaster"],["Bad first date idea","Good first date idea"],
  ["Underground band","Stadium band"],["Waste of money","Worth every penny"],["Normal job","Weird job"],
  ["Introverted animal","Extroverted animal"],["Mildly annoying","Infuriating"],
  ["Least important invention","Most important invention"],["Round animal","Pointy animal"],
  ["Bad candy","Good candy"],["Better as a book","Better as a movie"],["Ages like milk","Ages like wine"],
  ["Needs a remake","Untouchable classic"],["Underdressed","Overdressed"],["Easy to kill","Hard to kill"],
  ["Underpaid","Overpaid"],["Bad tattoo idea","Good tattoo idea"],["Terrible band name","Great band name"],
  ["Bad place to nap","Great place to nap"],["Bad karaoke song","Great karaoke song"],
  ["Useless kitchen gadget","Essential kitchen gadget"],["Bad roommate habit","Good roommate habit"],
  ["Useless in a zombie apocalypse","Essential in a zombie apocalypse"],["Annoying sound","Satisfying sound"],
  ["Bad Halloween costume","Great Halloween costume"],["Morning person thing","Night owl thing"],
  ["Wholesome","Unhinged"],["Uses your brain","Uses your body"],["Introvert","Extrovert"],
  ["Tastes like childhood","Tastes grown-up"],["Fun to say","Unpleasant to say"],["Red flag","Green flag"],
  ["Smart","Dumb"],["Unreliable","Reliable"]
  ],
  hard: [
  ["Vice","Virtue"],["Unethical","Ethical"],["Lowbrow","Highbrow"],["Comedy","Tragedy"],
  ["Optimistic","Pessimistic"],["Guilty pleasure","Openly loved"],["Thing you hide","Thing you show off"],
  ["Throwaway","Heirloom"],["Small talk","Deep conversation"],["Nature","Technology"],
  ["Sounds made up","Sounds true"],["Easy to explain","Hard to explain"],["Should be banned","Should be mandatory"],
  ["Not art","Art"],["Feels like a Monday","Feels like a Friday"],["Bad for society","Good for society"],
  ["Impulsive","Calculated"],["Soothing","Unsettling"],["Old money","New money"],["Corporate","Punk"],
  ["Underrated skill","Overrated skill"],["Mostly myth","Mostly true"],["Worthless","Priceless"],
  ["Background character","Main character"],["Historically irrelevant","Historically important"],
  ["Feels childish","Feels grown-up"],["Fair","Unfair"],["Harmless lie","Unforgivable lie"],
  ["Selfish","Selfless"],["Requires luck","Requires skill"],["Loved by critics","Loved by audiences"],
  ["Your problem","Society's problem"],["Mundane","Magical"],["Pretentious","Down to earth"],
  ["Ironic enjoyment","Sincere enjoyment"],["Easy to forgive","Hard to forgive"],
  ["Universal experience","Niche experience"],["Useless knowledge","Life-saving knowledge"],
  ["Underrated virtue","Overrated virtue"],
  ["Brave","Reckless"],["Good intentions","Good results"],
  ["Overthought","Underthought"],["Trendy","Timeless"],["Cringe","Iconic"],["Effortless","Try-hard"],
  ["Exclusive","Accessible"],["Masterpiece","Mess"],["Ahead of its time","Behind the times"],
  ["Would brag about","Would never admit"],["Healthy obsession","Unhealthy obsession"],
  ["Nobody needs it","Everybody needs it"]
  ]
};

// ---------- Scoring geometry (degrees, 0 = far left, 180 = far right) ----------
const BAND = 7.5; // width of each scoring band; the whole 2-3-4-3-2 zone is 5 bands wide
const DIFFICULTIES = {
  easy:   { label: "Easy",   note: "Concrete scales",   sets: ["easy"] },
  normal: { label: "Normal", note: "Taste and opinion", sets: ["normal"] },
  hard:   { label: "Hard",   note: "Abstract, debatable", sets: ["hard"] },
  mixed:  { label: "Mixed",  note: "Every card",        sets: ["easy", "normal", "hard"] }
};
const difficulty = () => DIFFICULTIES[S.difficulty] || DIFFICULTIES.normal;
function scoreFor(target, guess) {
  const d = Math.abs(target - guess);
  if (d <= BAND / 2) return 4;
  if (d <= BAND * 1.5) return 3;
  if (d <= BAND * 2.5) return 2;
  return 0;
}

// ---------- State ----------
const STORE_KEY = "wavelength-game-v1"; // original key, kept so saved games survive the rename
const fresh = () => ({
  phase: "setup", mode: "teams", teams: ["Team Sky", "Team Ember"], players: ["Player 1", "Player 2"],
  scores: [0, 0], goal: 10, coopLen: 7, cardsLeft: 7, total: 0, difficulty: "normal",
  active: 0, deck: [], card: null, target: 90, guess: 90, clue: "", lr: null,
  peek: false, last: null, extraTurn: false, custom: "", round: 0
});
let S = fresh();
try { const saved = JSON.parse(localStorage.getItem(STORE_KEY)); if (saved && saved.phase) S = Object.assign(fresh(), saved); } catch (e) {}
if (window.claude?.hot?.data?.S) S = window.claude.hot.data.S;
if (!DIFFICULTIES[S.difficulty]) S.difficulty = "normal";
window.claude?.hot?.snapshot?.(() => ({ S }));
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function parseCustom(text) {
  return text.split("\n").map(l => l.split("|").map(s => s.trim())).filter(p => p.length === 2 && p[0] && p[1]);
}
function allCards() { return difficulty().sets.flatMap(k => CARD_SETS[k]).concat(parseCustom(S.custom)); }
function drawCard() {
  if (!S.deck.length) S.deck = shuffle(allCards().map((_, i) => i));
  const pool = allCards();
  S.card = pool[S.deck.pop()] || pool[0];
}
// Keep the 4-point band fully on the dial.
function newTarget() { const m = BAND * 1.5; S.target = m + Math.random() * (180 - 2 * m); }

// ---------- Rendering helpers ----------
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
// Tuner geometry: positions are 0-180 (far left to far right) along a flat track.
const X0 = 30, X1 = 490, TOP = 48, BASE = 176;
const xAt = deg => X0 + (deg / 180) * (X1 - X0);
const degAt = x => ((x - X0) / (X1 - X0)) * 180;
function staticNoise() {
  let dots = "";
  for (let i = 0; i < 420; i++) {
    const x = 16 + Math.random() * 484, y = 36 + Math.random() * 148, w = 2 + Math.random() * 7;
    dots += `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="2" opacity="${(0.15 + Math.random() * 0.6).toFixed(2)}"/>`;
  }
  return dots;
}
function dialSVG({ screenOpen, showNeedle, draggable }) {
  const t = S.target, b = BAND;
  const bands = [
    [t - 2.5 * b, t - 1.5 * b, "--band2", "2", 50], [t - 1.5 * b, t - 0.5 * b, "--band3", "3", 90],
    [t - 0.5 * b, t + 0.5 * b, "--band4", "4", BASE - TOP], [t + 0.5 * b, t + 1.5 * b, "--band3", "3", 90],
    [t + 1.5 * b, t + 2.5 * b, "--band2", "2", 50]
  ];
  // FM-style scale: 88 to 108, a major tick every 2.
  const grid = [], scale = [];
  for (let f = 88; f <= 108; f++) {
    const x = xAt((f - 88) * 9), major = f % 2 === 0;
    grid.push(`<line x1="${x}" y1="${major ? 40 : 150}" x2="${x}" y2="${BASE}" stroke="var(--line)" stroke-width="1"/>`);
    if (major) scale.push(`<text x="${x}" y="22" text-anchor="middle" font-family="var(--font-mono)" font-size="12" fill="var(--muted)">${f}</text>`);
  }
  const bars = bands.map(([a0, a1, c, n, h]) => {
    const l = xAt(Math.max(0, a0)), r = xAt(Math.min(180, a1));
    if (r <= l) return "";
    const lx = xAt((a0 + a1) / 2);
    const label = lx > X0 && lx < X1 ? `<text x="${lx}" y="${BASE - 10}" text-anchor="middle" font-family="var(--font-mono)" font-size="13" fill="${n === "4" ? "#fff" : "var(--band-label)"}">${n}</text>` : "";
    return `<rect x="${l.toFixed(2)}" y="${BASE - h}" width="${(r - l).toFixed(2)}" height="${h}" fill="var(${c})"/>${label}`;
  }).join("");
  // The "signal": flat with a faint ripple, peaking over the target.
  let wave = "";
  for (let x = X0; x <= X1; x += 2) {
    const d = (x - xAt(t)) / (xAt(2.2 * b) - xAt(0));
    const y = BASE - 6 - (BASE - TOP - 6) * Math.exp(-d * d * 1.6) - 3 * Math.sin(x / 5);
    wave += (x === X0 ? "M" : "L") + x + "," + y.toFixed(1);
  }
  const nx = xAt(S.guess);
  return `
  <svg class="dial ${draggable ? "draggable" : ""}" viewBox="0 0 520 ${showNeedle ? 230 : 198}" ${draggable ? 'tabindex="0" role="slider" aria-label="Tuner guess" aria-valuemin="0" aria-valuemax="180" aria-valuenow="' + Math.round(S.guess) + '"' : 'aria-hidden="true"'}>
    <defs><clipPath id="panelClip"><rect x="12" y="32" width="496" height="160" rx="14"/></clipPath></defs>
    ${scale.join("")}
    <rect x="12" y="32" width="496" height="160" rx="14" fill="var(--dial)" stroke="var(--line)" stroke-width="2"/>
    <g clip-path="url(#panelClip)">
      ${grid.join("")}
      ${bars}
      <path d="${wave}" fill="none" stroke="var(--band4)" stroke-width="2.5" stroke-linejoin="round" opacity=".85"/>
      <line x1="${X0}" y1="${BASE}" x2="${X1}" y2="${BASE}" stroke="var(--muted)" stroke-width="2"/>
      <g class="static ${screenOpen ? "open" : ""}">
        <rect x="12" y="32" width="496" height="160" fill="var(--screen)"/>
        <g fill="var(--static-dot)">${staticNoise()}</g>
        <text x="260" y="118" text-anchor="middle" font-family="var(--font-mono)" font-size="16" letter-spacing="6" fill="var(--static-dot)">NO SIGNAL</text>
      </g>
    </g>
    ${showNeedle ? `
      <g class="needle" transform="translate(${nx.toFixed(2)},0)">
        <line x1="0" y1="34" x2="0" y2="196" stroke="var(--needle)" stroke-width="3"/>
        <path d="M0,198 L9,207 L-9,207 Z" fill="var(--needle)"/>
        <rect x="-17" y="206" width="34" height="22" rx="6" fill="var(--needle)"/>
        <line x1="-6" y1="213" x2="-6" y2="221" stroke="var(--dial)" stroke-width="2"/>
        <line x1="0" y1="213" x2="0" y2="221" stroke="var(--dial)" stroke-width="2"/>
        <line x1="6" y1="213" x2="6" y2="221" stroke="var(--dial)" stroke-width="2"/>
      </g>` : ""}
  </svg>`;
}
function cardHTML() {
  if (!S.card) return "";
  return `<div class="card"><div class="l">${esc(S.card[0])}</div><div class="mid">◄ ►</div><div class="r">${esc(S.card[1])}</div></div>`;
}
const names = () => S.mode === "coop" ? S.players : S.teams;
const COOP_RATINGS = [
  [0, "Total static. Are you two even in the same room?"],
  [4, "Faint signal. Keep fiddling with the dial."],
  [8, "Picking up something. A few good moments."],
  [12, "Clear reception. You get each other."],
  [16, "Same frequency. Friends would be jealous."],
  [20, "Mind melded. Nobody can tell you apart."],
  [24, "Telepathic. Please stop, you're scaring people."]
];
// Thresholds are tuned for 7 cards; scale them to the chosen game length.
const coopRating = n => COOP_RATINGS.filter(([min]) => n >= min * S.coopLen / 7).pop()[1];
function scoresHTML() {
  if (S.mode === "coop") {
    return `<div class="scores">
      <div class="team"><span class="name">Score</span><span><span class="pts">${S.total}</span></span></div>
      <div class="team"><span class="name">Cards left</span><span><span class="pts">${S.cardsLeft}</span></span></div>
    </div>`;
  }
  return `<div class="scores">${S.teams.map((n, i) => `
    <div class="team ${S.phase !== "setup" && S.phase !== "won" && S.active === i ? "active" : ""}">
      <span class="name">${esc(n)}</span>
      <span><span class="pts">${S.scores[i]}</span><span class="of"> / ${S.goal}</span></span>
    </div>`).join("")}</div>`;
}
const other = i => 1 - i;

// ---------- Phases ----------
function render() {
  save();
  const app = $("#app");
  $("#deckInfo").textContent = S.phase === "setup" ? `${difficulty().label} · ${allCards().length} cards` : (S.mode === "coop" ? `Card ${S.round} · 2 players` : `Round ${S.round} · ${S.deck.length} cards left`) + ` · ${difficulty().label}`;
  const team = esc(names()[S.active]), opp = esc(names()[other(S.active)]);
  const coop = S.mode === "coop";

  if (S.phase === "setup") {
    app.innerHTML = `
      <section class="panel">
        <h2>New game</h2>
        <div class="seg" role="group" aria-label="Game mode">
          <button id="modeTeams" aria-pressed="${!coop}">Teams<span>Two teams compete, 4+ players</span></button>
          <button id="modeCoop" aria-pressed="${coop}">2 players<span>Work together for a high score</span></button>
        </div>
        <div class="row">
          <label class="grow">${coop ? "First player" : "First team"}<input type="text" id="t0" value="${esc(names()[0])}" maxlength="24"></label>
          <label class="grow">${coop ? "Second player" : "Second team"}<input type="text" id="t1" value="${esc(names()[1])}" maxlength="24"></label>
        </div>
        ${coop
          ? `<label style="max-width:160px">Cards to play<input type="number" id="goal" min="3" max="20" value="${S.coopLen}"></label>`
          : `<label style="max-width:160px">Points to win<input type="number" id="goal" min="3" max="30" value="${S.goal}"></label>`}
        <div class="field-label" id="diffLabel">Difficulty <span class="hint">· which cards you get</span></div>
        <div class="seg four" role="group" aria-labelledby="diffLabel">
          ${Object.entries(DIFFICULTIES).map(([k, d]) => `<button id="diff-${k}" data-diff="${k}" aria-pressed="${S.difficulty === k}">${d.label}<span>${d.note} · ${d.sets.reduce((n, x) => n + CARD_SETS[x].length, 0)}</span></button>`).join("")}
        </div>
        <details>
          <summary>Add your own cards</summary>
          <p class="hint">One card per line, with the two ends separated by a bar. They are shuffled in with the built-in cards at any difficulty.</p>
          <textarea id="custom" placeholder="Bad karaoke song | Great karaoke song">${esc(S.custom)}</textarea>
        </details>
        <div class="row end"><button id="start">Start game</button></div>
      </section>
      <section class="panel">
        <details open>
          <summary>How to play</summary>
          ${coop ? `<ol class="rules">
            <li>You play on the same side. Take turns being the <b>Psychic</b>.</li>
            <li>The Psychic peeks at the hidden target while the other player looks away, then gives a <b>clue</b> that sits at that spot between the two ends of the card.</li>
            <li>The other player drags the <b>needle</b> to where they think the target is.</li>
            <li>Reveal and score 2, 3 or 4 by band. A bullseye earns you a <b>bonus card</b>.</li>
            <li>When the cards run out, add up your score and see how in sync you are.</li>
          </ol>` : `<ol class="rules">
            <li>Each round, one player on the active team is the <b>Psychic</b>. Everyone else looks away while the Psychic peeks at the hidden target.</li>
            <li>The Psychic gives a <b>clue</b> that sits at that spot between the two ends of the card. For "Cold ↔ Hot", a clue near the right might be "Lava".</li>
            <li>Their team talks it over and drags the <b>needle</b> to where they think the target is.</li>
            <li>The other team calls whether the target is to the <b>left or right</b> of the needle.</li>
            <li>Reveal. The guessing team scores 2, 3 or 4 by band. If they missed the bullseye and the other team called the side right, that team scores 1.</li>
            <li>A team that hits the 4 while still behind gets another turn. First team to the goal wins.</li>
          </ol>`}
        </details>
      </section>`;
    const readSetup = () => {
      const n = [$("#t0").value.trim(), $("#t1").value.trim()];
      const g = parseInt($("#goal").value, 10);
      if (coop) { S.players = [n[0] || "Player 1", n[1] || "Player 2"]; S.coopLen = Math.max(3, Math.min(20, g || 7)); }
      else { S.teams = [n[0] || "Team Sky", n[1] || "Team Ember"]; S.goal = Math.max(3, Math.min(30, g || 10)); }
      S.custom = $("#custom").value;
    };
    app.querySelectorAll("[data-diff]").forEach(b => b.onclick = () => { readSetup(); S.difficulty = b.dataset.diff; render(); });
    $("#modeTeams").onclick = () => { readSetup(); S.mode = "teams"; render(); };
    $("#modeCoop").onclick = () => { readSetup(); S.mode = "coop"; render(); };
    $("#start").onclick = () => { readSetup(); S.deck = []; newGame(Math.random() < 0.5 ? 0 : 1); };
    return;
  }

  if (S.phase === "psychic") {
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel">
        <div class="eyebrow">${coop ? team + " is the Psychic" + (S.extraTurn ? " · bonus card" : "") : team + " · Psychic's turn" + (S.extraTurn ? " · bonus turn" : "")}</div>
        ${cardHTML()}
        <div class="dialbox">${dialSVG({ screenOpen: S.peek, showNeedle: false })}</div>
        ${S.peek ? `
          <p class="hint" style="text-align:center">Psychic only. Memorize where the signal peaks, then hide it.</p>
          <div class="row" style="justify-content:center"><button id="hide">Hide the signal</button></div>`
        : `
          <p class="hint" style="text-align:center">${coop ? `Pass the device to ${team}. ${opp}, look away.` : `Pass the device to ${team}'s Psychic. Everyone else, look away.`}</p>
          <div class="row" style="justify-content:center">
            <button id="peek">Tune in (Psychic only)</button>
            <button class="ghost" id="skip">Draw a different card</button>
          </div>
          <label>Clue (optional, so everyone can see it)<input type="text" id="clue" maxlength="60" value="${esc(S.clue)}" placeholder="Say it out loud or type it here"></label>
          <div class="row end"><button id="toGuess">Clue given, start guessing</button></div>`}
      </section>`;
    if (S.peek) { $("#hide").onclick = () => { S.peek = false; render(); }; return; }
    $("#peek").onclick = () => { S.peek = true; render(); };
    $("#skip").onclick = () => { drawCard(); newTarget(); render(); };
    $("#clue").oninput = e => { S.clue = e.target.value; save(); };
    $("#toGuess").onclick = () => { S.phase = "guess"; S.guess = 90; render(); };
    return;
  }

  if (S.phase === "guess") {
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel">
        <div class="eyebrow">${coop ? opp : team} · Tune the dial</div>
        ${cardHTML()}
        ${S.clue ? `<div class="clue"><small>Clue</small>${esc(S.clue)}</div>` : ""}
        <div class="dialbox">${dialSVG({ screenOpen: false, showNeedle: true, draggable: true })}</div>
        <input type="range" id="slider" min="0" max="180" step="0.5" value="${S.guess}" aria-label="Needle position">
        <div class="row end"><button id="lock">Lock in guess</button></div>
      </section>`;
    bindDial();
    $("#lock").onclick = () => { if (coop) revealCoop(); else { S.phase = "leftright"; render(); } };
    return;
  }

  if (S.phase === "leftright") {
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel">
        <div class="eyebrow">${opp} · Call the side</div>
        ${cardHTML()}
        ${S.clue ? `<div class="clue"><small>Clue</small>${esc(S.clue)}</div>` : ""}
        <div class="dialbox">${dialSVG({ screenOpen: false, showNeedle: true })}</div>
        <p class="hint" style="text-align:center">${opp}: is the target to the left or right of ${team}'s needle?</p>
        <div class="lr">
          <button class="bl" id="callL">◄ Left</button>
          <button class="br" id="callR">Right ►</button>
        </div>
        <div class="row" style="justify-content:center"><button class="link" id="back">Back to the needle</button></div>
      </section>`;
    $("#callL").onclick = () => reveal("L");
    $("#callR").onclick = () => reveal("R");
    $("#back").onclick = () => { S.phase = "guess"; render(); };
    return;
  }

  if (S.phase === "reveal") {
    const L = S.last;
    const sideWord = L.side === "L" ? "left" : "right";
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel">
        <div class="eyebrow">Reveal</div>
        ${cardHTML()}
        ${S.clue ? `<div class="clue"><small>Clue</small>${esc(S.clue)}</div>` : ""}
        <div class="dialbox" id="revealDial">${dialSVG({ screenOpen: false, showNeedle: true })}</div>
        <div class="result">
          <div class="big ${L.pts ? "" : "zero"}">${L.pts ? "+" + L.pts : "0"}</div>
          ${coop ? `<div>${L.pts === 4 ? "Bullseye! You earn a bonus card." : L.pts ? "You score " + L.pts + "." : "Missed the bands this time."}</div>` : `
          <div>${L.pts === 4 ? "Bullseye for " + team + "!" : L.pts ? team + " scores " + L.pts + "." : team + " missed the bands."}</div>
          <div><span class="pill">${opp} called ${sideWord} · ${L.oppPt ? "+1 for " + opp : L.pts === 4 ? "no steal on a bullseye" : "wrong side"}</span></div>
          ${L.extra ? `<div class="hint">${team} hit the bullseye while behind and goes again.</div>` : ""}`}
        </div>
        <div class="row end"><button id="next">${coop && S.cardsLeft <= 0 ? "See your result" : "Next round"}</button></div>
      </section>`;
    // Switch the static off after first paint.
    requestAnimationFrame(() => requestAnimationFrame(() => { const s = $("#revealDial .static"); if (s) s.classList.add("open"); }));
    $("#next").onclick = () => {
      if (coop) {
        if (S.cardsLeft <= 0) { S.phase = "won"; render(); return; }
        S.active = other(S.active);
        startRound(L.pts === 4);
        return;
      }
      const w = S.scores.findIndex(s => s >= S.goal);
      if (w >= 0) { S.phase = "won"; S.winner = S.scores[0] === S.scores[1] ? S.active : (S.scores[0] > S.scores[1] ? 0 : 1); render(); return; }
      if (!L.extra) S.active = other(S.active);
      startRound(L.extra);
    };
    return;
  }

  if (S.phase === "won" && coop) {
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel winner">
        <div class="eyebrow">${team} &amp; ${opp} · ${S.round} cards played</div>
        <div class="big">${S.total} points</div>
        <p>${coopRating(S.total)}</p>
        <div class="row" style="justify-content:center">
          <button id="again">Play again</button>
          <button class="ghost" id="setup">Change mode or names</button>
        </div>
      </section>`;
    $("#again").onclick = () => newGame(other(S.active));
    $("#setup").onclick = () => { S.phase = "setup"; render(); };
    return;
  }

  if (S.phase === "won") {
    app.innerHTML = `
      ${scoresHTML()}
      <section class="panel winner">
        <div class="eyebrow">Game over after ${S.round} rounds</div>
        <div class="big">${esc(S.teams[S.winner])} wins</div>
        <p class="hint">${S.scores[S.winner]} to ${S.scores[other(S.winner)]}</p>
        <div class="row" style="justify-content:center">
          <button id="again">Play again</button>
          <button class="ghost" id="setup">Change teams</button>
        </div>
      </section>`;
    $("#again").onclick = () => newGame(other(S.winner));
    $("#setup").onclick = () => { S.phase = "setup"; render(); };
  }
}

function newGame(first) {
  S.scores = [0, 0]; S.total = 0; S.cardsLeft = S.coopLen; S.round = 0; S.active = first;
  startRound();
}

function revealCoop() {
  const pts = scoreFor(S.target, S.guess);
  S.total += pts;
  S.cardsLeft += (pts === 4 ? 1 : 0) - 1;
  S.last = { pts };
  S.phase = "reveal";
  render();
}

function startRound(extra = false) {
  S.round++; S.clue = ""; S.peek = false; S.lr = null; S.extraTurn = extra;
  drawCard(); newTarget(); S.guess = 90; S.phase = "psychic"; render();
}

function reveal(side) {
  const pts = scoreFor(S.target, S.guess);
  const targetSide = S.target < S.guess ? "L" : "R";
  const oppPt = pts < 4 && side === targetSide ? 1 : 0;
  S.scores[S.active] += pts;
  S.scores[other(S.active)] += oppPt;
  const extra = pts === 4 && S.scores[S.active] < S.scores[other(S.active)] && !S.scores.some(s => s >= S.goal);
  S.last = { pts, oppPt, side, extra };
  S.phase = "reveal";
  render();
}

function bindDial() {
  const svg = $("svg.dial"), slider = $("#slider");
  const set = deg => {
    S.guess = Math.max(0, Math.min(180, deg));
    svg.querySelector(".needle").setAttribute("transform", `translate(${xAt(S.guess).toFixed(2)},0)`);
    svg.setAttribute("aria-valuenow", Math.round(S.guess));
    slider.value = S.guess;
  };
  const fromEvent = e => {
    const p = svg.createSVGPoint(); p.x = e.clientX; p.y = e.clientY;
    const q = p.matrixTransform(svg.getScreenCTM().inverse());
    set(degAt(q.x));
  };
  let dragging = false;
  svg.addEventListener("pointerdown", e => { dragging = true; svg.setPointerCapture(e.pointerId); fromEvent(e); });
  svg.addEventListener("pointermove", e => { if (dragging) fromEvent(e); });
  svg.addEventListener("pointerup", () => { dragging = false; save(); });
  svg.addEventListener("pointercancel", () => { dragging = false; });
  svg.addEventListener("keydown", e => {
    const step = e.shiftKey ? 5 : 1;
    if (e.key === "ArrowLeft" || e.key === "ArrowDown") { set(S.guess - step); e.preventDefault(); }
    if (e.key === "ArrowRight" || e.key === "ArrowUp") { set(S.guess + step); e.preventDefault(); }
  });
  slider.addEventListener("input", () => set(parseFloat(slider.value)));
}

// Reset link in the header for abandoning a game.
(function addReset() {
  const btn = document.createElement("button");
  btn.className = "link"; btn.textContent = "New game"; btn.id = "reset";
  btn.onclick = () => {
    if (S.phase === "setup") return;
    if (btn.dataset.armed) { const keep = { mode: S.mode, teams: S.teams, players: S.players, goal: S.goal, coopLen: S.coopLen, difficulty: S.difficulty, custom: S.custom }; S = Object.assign(fresh(), keep); delete btn.dataset.armed; btn.textContent = "New game"; render(); return; }
    btn.dataset.armed = "1"; btn.textContent = "Tap again to quit this game";
    setTimeout(() => { delete btn.dataset.armed; btn.textContent = "New game"; }, 3000);
  };
  $("header").appendChild(btn);
})();

render();
</script>
</body>
</html>
